    - size: small
      widgets: 
        - type: markets
          markets:
            - symbol: USDMYR=X
              name: USD -> MYR
            - symbol: SGDMYR=X
              name: SGD -> MYR
            - symbol: MYRTWD=X
              name: MYR -> TWD
            - symbol: MYRJPY=X
              name: MYR to JPY
            - symbol: CSPX.L
              name: S&P 500 (iShares)

        - type: custom-api
          title: xkcd
          cache: 2m
          url: https://xkcd.com/info.0.json
          template: | 
            <body> {{ .JSON.String "title" }}</body>
            <img src="{{ .JSON.String "img" }}"></img>

        - type: custom-api
          title: Random Fact
          cache: 3h
          url: https://uselessfacts.jsph.pl/api/v2/facts/random
          template: |
            <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

        - type: custom-api
          title: Random Bible Verse
          cache: 3h
          url: https://bible-api.com/data/web/random
          template: |
            <p class="size-h2 color-highlight">{{ .JSON.String "random_verse.book" }} {{ .JSON.String "random_verse.chapter" }}:{{ .JSON.String "random_verse.verse" }}</p>
            <p class="size-h4 color-paragraph">{{ .JSON.String "random_verse.text" }}</p>
