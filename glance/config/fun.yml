- name: Entertainment
  columns:
    - size: small
      widgets:
        - type: custom-api
          title: Media Server
          cache: 1m
          options:
            media-server: "jellyfin"
            base-url: ${JELLYFIN_URL}
            api-key: ${JELLYFIN_API_KEY}
            small-column: true
            compact: true
            play-state: "indicator"
            show-thumbnail: true
            full-thumbnail: true
            show-paused: true
            show-progress-bar: true
            show-progress-info: true
            time-format: "15:04"
          template: |
            {{ $mediaServer := .Options.StringOr "media-server" "" }}
            {{ $baseURL := .Options.StringOr "base-url" "" }}
            {{ $apiKey := .Options.StringOr "api-key" "" }}

            {{ define "errorMsg" }}
              <div class="widget-error-header">
                <div class="color-negative size-h3">ERROR</div>
                <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                </svg>
              </div>
              <p class="break-all">{{ . }}</p>
            {{ end }}

            {{ if or
              (eq $mediaServer "")
              (eq $baseURL "")
              (eq $apiKey "")
            }}
              {{ template "errorMsg" "Some required options are not set" }}
            {{ else }}

            {{ $isSmallColumn := .Options.BoolOr "small-column" false }}
            {{ $isCompact := .Options.BoolOr "compact" true }}
            {{ $playState := .Options.StringOr "play-state" "indicator" }}
            {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
            {{ $fullThumbnail := .Options.BoolOr "full-thumbnail" false }}
            {{ $showPaused := .Options.BoolOr "show-paused" false }}
            {{ $showProgressBar := .Options.BoolOr "show-progress-bar" false }}
            {{ $showProgressInfo := .Options.BoolOr "show-progress-info" true }}
            {{ $timeFormat := .Options.StringOr "time-format" "15:04" }}

            {{ $userID := "" }}
            {{ $sessionsRequestURL := "" }}
            {{ $sessionsCall := "" }}
            {{ $sessions := "" }}
            {{ $activeSessions := 0 }}

            {{ if eq $mediaServer "plex" }}
              {{ $sessionsRequestURL = concat $baseURL "/status/sessions" }}
              {{ $sessionsCall = newRequest $sessionsRequestURL
                | withHeader "Accept" "application/json"
                | withHeader "X-Plex-Token" $apiKey
                | getResponse }}

              {{ if $sessionsCall.JSON.Exists "MediaContainer" }}
                {{ $sessions = $sessionsCall.JSON.Array "MediaContainer.Metadata" }}
                {{ $activeSessions = len $sessions }}
              {{ else }}
                {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
              {{ end }}

            {{ else if eq $mediaServer "tautulli" }}
              {{ $sessionsRequestURL = concat $baseURL "/api/v2" }}
              {{ $sessionsCall = newRequest $sessionsRequestURL
                | withParameter "apikey" $apiKey
                | withParameter "cmd" "get_activity"
                | withHeader "Accept" "application/json"
                | getResponse }}

              {{ if eq $sessionsCall.Response.StatusCode 200 }}
                {{ $sessions = $sessionsCall.JSON.Array "response.data.sessions" }}
                {{ $activeSessions = len $sessions }}
              {{ else }}
                {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
              {{ end }}

            {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
              {{ $sessionsRequestURL = concat $baseURL "/Sessions" }}
              {{ $sessionsCall = newRequest $sessionsRequestURL
                | withParameter "api_key" $apiKey
                | withParameter "activeWithinSeconds" "30"
                | withHeader "Accept" "application/json"
                | getResponse }}

              {{ if eq $sessionsCall.Response.StatusCode 200 }}
                {{ $sessions = $sessionsCall.JSON.Array "" }}
                {{ if eq $mediaServer "emby" }}
                  {{ range $session := $sessions }}
                    {{ if $session.Bool "PlayState.CanSeek" }}
                      {{ $activeSessions = 1 }}
                      {{ break }}
                    {{ end }}
                  {{ end }}
                {{ else }}
                  {{ $activeSessions = len $sessions }}
                {{ end }}
              {{ else }}
                {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
              {{ end }}
            {{ end }}

            {{ if and (eq $sessionsCall.Response.StatusCode 200) (eq $activeSessions 0) }}
              <p>Nothing is playing right now.</p>
            {{ else }}

              <style>
                .media-server-session-container--grid {
                  display: grid;
                  grid-template-columns: repeat(2, 1fr);
                }
                @media (max-width: 768px) {
                  .media-server-session-container--grid {
                    display: flex;
                    flex-direction: column;
                  }
                }
                .media-server-progress-container {
                  height: 1rem;
                  max-width: 32rem;
                  border: 1px solid var(--color-text-base);
                  border-radius: var(--border-radius);
                  overflow: hidden;
                }
                .media-server-progress-bar {
                  height: 100%;
                  background: var(--color-primary);
                  border-radius: 3px;
                  transition: width 1s linear;
                }
                @keyframes progress-animation { to { width: 100%; } }
              </style>

              <div class="gap-10 {{ if $isSmallColumn }}flex flex-column{{ else }}media-server-session-container--grid{{ end }}">
              {{ range $i, $session := $sessions }}
                {{ $isClient := true }}
                {{ $isPlaying := false }}
                {{ $state := "playing" }}
                {{ $isMovie := false }}
                {{ $isShows := false }}
                {{ $isMusic := false }}
                {{ $userName := "" }}
                {{ $title := "" }}
                {{ $showTitle := "" }}
                {{ $showSeason := "" }}
                {{ $showEpisode := "" }}
                {{ $artist := "" }}
                {{ $albumTitle := "" }}
                {{ $thumbURL := "" }}
                {{ $now := now | formatTime "15:04:05" | parseLocalTime "15:04:05" }}
                {{ $duration := 0 }}
                {{ $offset := 0 }}
                {{ $remainingSeconds := 0 }}

                {{ if eq $mediaServer "plex" }}
                  {{ $isPlaying = eq ($session.String "Player.state") "playing" }}
                  {{ if not $isPlaying }}
                    {{ $state = "paused"}}
                  {{ end }}

                  {{ $mediaType := $session.String "type" }}
                  {{ $isMovie = eq $mediaType "movie" }}
                  {{ $isShows = eq $mediaType "episode" }}
                  {{ $isMusic = eq $mediaType "track" }}

                  {{ $userName = $session.String "User.title" }}
                  {{ $title = $session.String "title" }}
                  {{ $showTitle = $session.String "grandparentTitle" }}
                  {{ $showSeason = $session.String "parentIndex" }}
                  {{ $showEpisode = $session.String "index" }}
                  {{ $artist = $session.String "grandparentTitle" }}
                  {{ $albumTitle = $session.String "parentTitle" }}

                  {{ $thumbID := $session.String "thumb" }}
                  {{ if or $isShows $isMusic }}
                    {{ $thumbID = $session.String "parentThumb" }}
                  {{ end }}
                  {{ $thumbURL = concat $baseURL $thumbID "?X-Plex-Token=" $apiKey }}

                  {{ $duration = $session.Float "duration" }}
                  {{ $offset = $session.Float "viewOffset" }}
                  {{ $remainingSeconds = div (sub $duration $offset) 1000 | toInt }}
                {{ else if eq $mediaServer "tautulli" }}
                  {{ $isPlaying = eq ($session.String "state") "playing" }}
                  {{ if not $isPlaying }}
                    {{ $state = "paused"}}
                  {{ end }}

                  {{ $mediaType := $session.String "media_type" }}
                  {{ $isMovie = eq $mediaType "movie" }}
                  {{ $isShows = eq $mediaType "episode" }}
                  {{ $isMusic = eq $mediaType "track" }}

                  {{ $userName = $session.String "user" }}
                  {{ $title = $session.String "title" }}
                  {{ $showTitle = $session.String "grandparent_title" }}
                  {{ $showSeason = $session.String "parent_media_index" }}
                  {{ $showEpisode = $session.String "media_index" }}
                  {{ $artist = $session.String "grandparent_title" }}
                  {{ $albumTitle = $session.String "parent_title" }}

                  {{ $thumbID := $session.String "thumb" }}
                  {{ if or $isShows $isMusic }}
                    {{ $thumbID = $session.String "parent_thumb" }}
                  {{ end }}
                  {{ $thumbURL = concat $baseURL "/api/v2?apikey=" $apiKey "&cmd=pms_image_proxy&img=" $thumbID }}

                  {{ $duration = $session.Float "duration" }}
                  {{ $offset = $session.Float "view_offset" }}
                  {{ $remainingSeconds = div (sub $duration $offset) 1000 | toInt }}
                {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                  {{ if eq $mediaServer "emby" }}
                    {{ $isClient = $session.Bool "PlayState.CanSeek" }}
                  {{ end }}
                  {{ $isPlaying = and ($session.Exists "NowPlayingItem") (not ($session.Bool "PlayState.IsPaused")) }}
                  {{ if not $isPlaying }}
                    {{ $state = "paused"}}
                  {{ end }}

                  {{ $mediaType := $session.String "NowPlayingItem.Type" }}
                  {{ $isMovie = eq $mediaType "Movie" }}
                  {{ $isShows = eq $mediaType "Episode" }}
                  {{ $isMusic = eq $mediaType "Audio" }}

                  {{ $userName = $session.String "UserName" }}
                  {{ $title = $session.String "NowPlayingItem.Name" }}
                  {{ $showTitle = $session.String "NowPlayingItem.SeriesName" }}
                  {{ $showSeason = $session.String "NowPlayingItem.ParentIndexNumber" }}
                  {{ $showEpisode = $session.String "NowPlayingItem.IndexNumber" }}
                  {{ $artist = $session.String "NowPlayingItem.AlbumArtist" }}
                  {{ $albumTitle = $session.String "NowPlayingItem.Album" }}

                  {{ $thumbID := $session.String "NowPlayingItem.Id" }}
                  {{ if $isShows }}
                    {{ $thumbID = $session.String "NowPlayingItem.ParentId" }}
                  {{ end }}
                  {{ $thumbURL = concat $baseURL "/Items/" $thumbID "/Images/Primary?api_key=" $apiKey }}

                  {{ $duration = $session.Float "NowPlayingItem.RunTimeTicks" }}
                  {{ $offset = $session.Float "PlayState.PositionTicks" }}
                  {{ $remainingSeconds = div (sub $duration $offset) 10000000 | toInt }}
                {{ end }}

                {{ $progress := mul 100 (div $offset $duration) | toInt }}
                {{ $endTime := $now.Add (duration (printf "%ds" $remainingSeconds)) | formatTime $timeFormat }}

                {{ $showInfoFormat := concat "Season " $showSeason " Episode " $showEpisode}}
                {{ if $isCompact }}
                  {{ $showInfoFormat = concat "S" $showSeason "E" $showEpisode}}
                {{ end }}

                {{ if and $isClient (or $isPlaying $showPaused) }}
                <div class="card gap-5">
                  <div class="flex items-center gap-10 size-h3">
                    <span class="color-primary">{{ $userName }}</span>
                    {{ if eq $playState "text" }}
                      <span {{ if $isPlaying }}class="color-primary"{{ end }}>
                        [{{ $state }}]
                      </span>
                    {{ else if eq $playState "indicator" }}
                      <style>
                        .media-server-indicator {
                          height: .7rem;
                          width: .7rem;
                          border-radius: 100%;
                          {{ if $isPlaying }}
                            animation: pulse 5s infinite;
                            background: var(--color-primary);
                          {{ else }}
                            background: var(--color-text-base-muted);
                          {{ end }}
                        }
                        @keyframes pulse {
                          0% { box-shadow: 0 0 0 0 var(--color-text-base); }
                          40% { box-shadow: 0 0 0 4px transparent; }
                          100% { box-shadow: 0 0 0 4px transparent; }
                        }
                      </style>
                      <div class="media-server-indicator"></div>
                    {{ end }}
                  </div>

                  <hr class="margin-bottom-5" />

                  <div class="flex items-center gap-10" style="align-items: stretch;">
                    {{ if $showThumbnail }}
                      <img src="{{ $thumbURL | safeURL }}"
                        alt="{{ $title }} thumbnail"
                        class="shrink-0"
                        loading="lazy"
                        style="
                          max-width: 7.5rem;
                          border: 2px solid var(--color-primary);
                          border-radius: var(--border-radius);
                          object-fit: cover;
                          {{ if and $isCompact (not $fullThumbnail) }} aspect-ratio: 1; {{ end }} "
                      />
                    {{ end }}
                    <ul class="flex flex-column grow justify-evenly" style="width: 0;">
                      {{ if $isCompact }}
                        {{ if $isShows }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="shrink-0">{{ concat "S" $showSeason "E" $showEpisode }}</li>
                            <li class="text-truncate">{{ $showTitle }}</li>
                          </ul>
                        {{ else if $isMusic }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="shrink-0">{{ $artist }}</li>
                            <li class="text-truncate">{{ $albumTitle }}</li>
                          </ul>
                        {{ end }}
                        <li class="text-truncate">{{ $title }}</li>
                      {{ else }}
                        {{ if $isShows }}
                          <li>{{ $showTitle }}</li>
                          <li>{{ concat "S" $showSeason "E" $showEpisode }}</li>
                        {{ else if $isMusic }}
                          <li>{{ $artist }}</li>
                          <li>{{ $albumTitle }}</li>
                        {{ end }}
                        <li>{{ $title }}</li>
                      {{ end }}

                      <li>
                        {{ if and $isPlaying $showProgressBar }}
                          <div class="flex gap-10 items-center">
                            <div class="media-server-progress-container grow">
                              <div
                                class ="media-server-progress-bar"
                                data-progress="{{ $progress }}"
                                data-remaining="{{ $remainingSeconds }}"
                                style="
                                  width: {{ $progress }}%;
                                  animation: progress-animation {{ $remainingSeconds }}s linear forwards;"
                              >
                              </div>
                            </div>
                            {{ if $showProgressInfo }}
                              <p>
                                {{ if and (not $isCompact) (not $isSmallColumn) }}
                                  ends at 
                                {{ end }}
                                {{ $endTime }}
                              </p>
                            {{ end }}
                          </div>
                        {{ end }}
                      </li>
                    </ul>
                  </div>
                </div>
                {{ end }}
              {{ end }}
            </div>
            {{ end }}
            {{ end }}

        # wait spotify, https://github.com/glanceapp/community-widgets/blob/main/widgets/spotify-now-playing/README.md

        - type: custom-api
          title: Steam Specials
          cache: 12h
          url: https://store.steampowered.com/api/featuredcategories?cc=us
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
            {{ range .JSON.Array "specials.items" }}
              {{ $header := .String "header_image" }}
              {{ $urlPrefix := "https://store.steampowered.com/sub/" }}
              {{ if findMatch "/steam/apps/" $header }}
                {{ $urlPrefix = "https://store.steampowered.com/app/" }}
              {{ end }}
              <li>
                <a class="size-h4 color-highlight block text-truncate" href="{{ $urlPrefix }}{{ .Int "id" }}/">{{ .String "name" }}</a>
                <ul class="list-horizontal-text">
                  <li>{{ .Int "final_price" | toFloat | mul 0.01 | printf "$%.2f" }}</li>
                  {{ $discount := .Int "discount_percent" }}
                  <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                </ul>
              </li>
            {{ end }}
            </ul>

        - type: custom-api
          title: Epic Games
          cache: 1h
          url: https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en&country=US&allowCountries=US
          template: |
            <div>
              {{ if eq .Response.StatusCode 200 }}
                <div class="horizontal-cards-2">
                  {{ range .JSON.Array "data.Catalog.searchStore.elements" }}
                    {{ $price := .String "price.totalPrice.discountPrice" }}
                    {{ $hasPromo := gt (len (.Array "promotions.promotionalOffers")) 0 }}
                    {{ if and $hasPromo (eq $price "0") }}
                      {{ $gamePage := .String "productSlug" }}
                      {{ if gt (len (.Array "offerMappings")) 0 }}
                        {{ $gamePage = .String "offerMappings.0.pageSlug" }}
                      {{end }}
                      <a href="https://store.epicgames.com/en-US/p/{{ $gamePage }}" target="_blank" class="card">
                        {{ $title := .String "title" }}
                        {{ range .Array "keyImages" }}
                          {{ if eq (.String "type") "OfferImageWide" }}
                            <img src="{{ .String "url" }}" alt="{{ $title }}" style="width: 100%; max-width: 300px; height: 150px; object-fit: cover; border-radius: var(--border-radius);">
                          {{ end }}
                        {{ end }}
                        <div class="card-content">
                          <span class="size-base color-primary">{{ $title }}</span><br>
                          <span class="size-h5 color-subdue">
                            {{ if $hasPromo }}
                              {{ $promotions := .Array "promotions.promotionalOffers" }}
                              {{ if gt (len $promotions) 0 }}
                                {{ $firstPromo := index $promotions 0 }}
                                {{ $offers := $firstPromo.Array "promotionalOffers" }}
                                {{ if gt (len $offers) 0 }}
                                  {{ $firstOffer := index $offers 0 }}
                                  Free until {{ slice ($firstOffer.String "endDate") 0 10 }}
                                {{ else }}
                                  Free this week!
                                {{ end }}
                              {{ else }}
                                Free this week!
                              {{ end }}
                            {{ end }}
                          </span>
                        </div>
                      </a>
                    {{ end }}
                  {{ end }}
                </div>
              {{ else }}
                <p class="color-negative">Error fetching Epic Games data.</p>
              {{ end }}
            </div>

    - size: full
      widgets:
        - type: custom-api
          title: Latest Shows
          frameless: true
          cache: 5m
          options:
            base-url: ${JELLYFIN_URL}
            api-key: ${JELLYFIN_API_KEY}
            user-name: "xs"
            library-name: "Shows"
            mode: "latest"
            item-count: "10"
            thumbnail-aspect-ratio: "default"
            media-types: "Movie,Episode,MusicAlbum" # Which media types to include in the results
            small-column: false                     # `true` if using the widget in a small column
            show-thumbnail: true                   # `true` to show thumbnails
            progress-bar: true                      # `true` to display a progress bar (only applied in `nextup` mode)
          template: |
            {{/* Required config options */}}
            {{ $baseURL := .Options.StringOr "base-url" "" }}
            {{ $apiKey := .Options.StringOr "api-key" "" }}
            {{ $userName := .Options.StringOr "user-name" "" }}

            {{/* Required config options for "latest" mode */}}
            {{ $libraryName := .Options.StringOr "library-name" "" }}

            {{/* Optional config options */}}
            {{ $mode := .Options.StringOr "mode" "latest" }}
            {{ $itemCount := .Options.StringOr "item-count" "10" }}
            {{ $mediaTypes := .Options.StringOr "media-types" "Movie,Episode,MusicAlbum" }}
            {{ $thumbAspectRatio := .Options.StringOr "thumbnail-aspect-ratio" "" }}
            {{ $isSmallColumn:= .Options.BoolOr "small-column" false }}
            {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
            {{ $showProgressBar := .Options.BoolOr "progress-bar" true }}

            {{/* Error message template */}}
            {{ define "errorMsg" }}
              <div class="widget-error-header">
                <div class="color-negative size-h3">ERROR</div>
                <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                </svg>
              </div>
              <p class="break-all">{{ . }}</p>
            {{ end }}

            {{/* Check required fields */}}
            {{ if or (eq $baseURL "") (eq $apiKey "") (eq $userName "") (eq $mode "") (and (eq $mode "latest") (eq $libraryName "")) }}
              {{ template "errorMsg" "Some required options are not set." }}
            {{ else }}

              {{/* Fetch user ID */}}
              {{ $userID := "" }}
              {{ $usersCall := newRequest (print $baseURL "/Users")
                  | withParameter "api_key" $apiKey
                  | withHeader "Accept" "application/json"
                  | getResponse }}

              {{ range $i, $user := $usersCall.JSON.Array "" }}
                {{ if eq ($user.String "Name") $userName }}
                  {{ $userID = $user.String "Id" }}
                  {{ break }}
                {{ end }}
              {{ end }}
              {{ if eq $userID "" }}
                {{ template "errorMsg" (printf "User '%s' not found." $userName) }}
              {{ else }}

                {{ $items := "" }}

                {{ if eq $mode "latest" }}

                  {{/* Fetch library ID */}}
                  {{ $libraryID := "" }}
                  {{ $userViewsCall := newRequest (print $baseURL "/UserViews")
                      | withParameter "api_key" $apiKey
                      | withParameter "userId" $userID
                      | withHeader "Accept" "application/json"
                      | getResponse }}

                  {{ range $i, $item := $userViewsCall.JSON.Array "Items" }}
                    {{ if eq ($item.String "Name") $libraryName }}
                      {{ $libraryID = $item.String "Id" }}
                      {{ break }}
                    {{ end }}
                  {{ end }}

                  {{ if eq $libraryID "" }}
                    {{ template "errorMsg" (printf "Library '%s' not found." $libraryName) }}
                  {{ else }}
                    {{/* Fetch latest items */}}
                    {{ $latestCall := newRequest (print $baseURL "/Users/" $userID "/Items/Latest")
                        | withParameter "api_key" $apiKey
                        | withParameter "Limit" $itemCount
                        | withParameter "ParentId" $libraryID
                        | withParameter "IncludeItemTypes" $mediaTypes
                        | withParameter "GroupItems" "true"
                        | withHeader "Accept" "application/json"
                        | getResponse }}
                    {{ $items = $latestCall.JSON.Array "" }}
                  {{ end }}

                {{ else if eq $mode "nextup" }}

                  {{/* Fetch next up items */}}
                  {{ $nextUpCall := newRequest (print $baseURL "/Shows/NextUp")
                    | withParameter "api_key" $apiKey
                    | withParameter "UserId" $userID
                    | withParameter "Limit" $itemCount
                    | withParameter "EnableResumable" "true"
                    | withHeader "Accept" "application/json"
                    | getResponse }}
                  {{ $items = $nextUpCall.JSON.Array "Items" }}

                {{ else }}
                  {{ template "errorMsg" "Unknown mode, expected 'latest' or 'nextup'" }}
                {{ end }}

                {{ if eq (len $items) 0 }}
                  <p>No items found, start streaming something!</p>
                {{ else }}

                  {{/* Display the item carousel */}}
                  <div class="carousel-container show-right-cutoff">
                    <div class="cards-horizontal carousel-items-container">
                      {{ range $n, $item := $items }}
                        {{/* Common item variables */}}
                        {{ $mediaType := $item.String "Type" }}
                        {{ $title := $item.String "Name" }}
                        {{ $itemID := $item.String "Id" }}

                        {{/* Media type specific variables */}}
                        {{ $seriesTitle := "" }}
                        {{ $artist := "" }}
                        {{ $seriesID := "" }}
                        {{ $season := "" }}
                        {{ $episode := "" }}
                        {{ $playPercentage := "" }}
                        {{ $unwatchedEpisodeCount := "" }}

                        {{ if eq $mediaType "Movie" }}
                        {{ else if eq $mediaType "Series" }}
                          {{ $unwatchedEpisodeCount = $item.Int "UserData.UnplayedItemCount" }}
                        {{ else if eq $mediaType "Episode" }}
                          {{ $unwatchedEpisodeCount = 1 }}
                          {{ $seriesTitle = $item.String "SeriesName" }}
                          {{ $seriesID = $item.String "SeriesId" }}
                          {{ $season = $item.Int "ParentIndexNumber" }}
                          {{ $episode = $item.Int "IndexNumber" }}

                          {{ if $item.Exists "UserData.PlayedPercentage" }}
                            {{ $playPercentage = $item.String "UserData.PlayedPercentage" }}
                          {{ end }}

                          {{/* For latest always refer to the series not individual episodes */}}
                          {{ if eq $mode "latest" }}
                            {{ $itemID = $seriesID }}
                            {{ $title = $seriesTitle }}
                          {{ end }}
                        {{ else if eq $mediaType "MusicAlbum" }}
                          {{ $artist = $item.String "AlbumArtist" }}
                        {{ end }}

                        {{ $linkURL := print $baseURL "/web/#/details?id=" $itemID }}
                        {{ $thumbURL := "" }}
                        {{ if not (eq $playPercentage "") }}
                          {{/* $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey "&percentPlayed=" $playPercentage */}}
                          {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                        {{ else }}
                          {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                        {{ end }}

                        <a class="card widget-content-frame" href="{{ $linkURL | safeURL }}">
                          {{ if $showThumbnail }}
                            <div style="position: relative;">
                              <img src="{{ $thumbURL | safeURL }}"
                                alt="{{ $title }} thumbnail"
                                loading="lazy"
                                class="media-server-thumbnail shrink-0"
                                style="
                                  object-fit: fill;
                                  border-radius: var(--border-radius) var(--border-radius) 0 0;
                                  width: 100%;
                                  display: block;
                                  {{ if eq $thumbAspectRatio "square" }}aspect-ratio: 1;
                                  {{ else if eq $thumbAspectRatio "portrait" }}aspect-ratio: 2/3;
                                  {{ else if eq $thumbAspectRatio "landscape" }}aspect-ratio: 16/9;
                                  {{ else }}aspect-ratio: initial;
                                  {{ end }}
                                "
                              />

                              {{ if and ($showProgressBar) (not (eq $playPercentage "")) }}
                                <div style="
                                  position: absolute;
                                  bottom: 8px;
                                  left: 8px;
                                  right: 8px;
                                  height: 6px;
                                  border-radius: var(--border-radius);
                                  overflow: hidden;
                                  background-color: rgba(255, 255, 255, 0.2);
                                ">
                                  <div style="
                                    width: {{ print $playPercentage "%" }};
                                    height: 100%;
                                    border-radius: var(--border-radius) 0 0 var(--border-radius);
                                    background-color: var(--color-primary)
                                  "></div>
                                </div>
                              {{ end }}
                            </div>
                          {{ end }}

                          <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                            <ul class="flex flex-column justify-evenly margin-bottom-3 {{ if $isSmallColumn }}size-h6{{ end }}" style="height: 100%;">
                              {{ if eq $mode "latest" }}
                                {{ if or (eq $mediaType "Series") (eq $mediaType "Episode") }}
                                  <ul class="list-horizontal-text flex-nowrap">
                                    <li class="color-primary shrink-0">{{ $unwatchedEpisodeCount }}</li>
                                    <li class="text-truncate">{{ $title }}</li>
                                  </ul>
                                {{ else if eq $mediaType "MusicAlbum" }}
                                  <ul class="list-horizontal-text flex-nowrap">
                                    <li class="color-primary text-truncate">{{ $artist }}</li>
                                    <li class="text-truncate">{{ $title }}</li>
                                  </ul>
                                {{ else }}
                                  <li class="text-truncate">{{ $title }}</li>
                                {{ end }}
                              {{ else if eq $mode "nextup" }}
                                <ul class="list-horizontal-text flex-nowrap">
                                  <li class="color-primary shrink-0">S{{ $season }}E{{ $episode }}</li>
                                  <li class="text-truncate">{{ $seriesTitle }}</li>
                                </ul>
                                <li class="text-truncate">{{ $title }}</li>
                              {{ end }}
                            </ul>
                          </div>
                        </a>
                      {{ end }}
                    </div>
                  </div>
                {{ end }}
              {{ end }}
            {{ end }}

        - type: custom-api
          title: Seasonal Anime
          frameless: true
          cache: 1d
          url: https://api.jikan.moe/v4/seasons/now
          template: |
            {{ $arr := .JSON.Array "data" }}
            <div style="overflow-x: auto; padding: 8px 0;">
              <div class="cards-horizontal carousel-items-container" style="display: flex; gap: 16px; padding: 0 8px;">
                {{ range $i, $el := $arr }}
                  {{ if lt $i 15 }}
                    {{ $image := $el.String "images.jpg.image_url" }}
                    {{ $score := $el.Float "score" }}
                    {{ $type := $el.String "type" }}
                    {{ $episodes := $el.Int "episodes" }}
                    
                    <a href="{{ $el.String "url" }}" target="_blank" 
                      class="card widget-content-frame" 
                      style="flex: 0 0 auto; width: 150px; min-height: 260px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); background: var(--card-bg); text-decoration: none;">
                      
                      <!-- Thumbnail with Score -->
                      <div style="height: 190px; overflow: hidden; position: relative;">
                        <img src="{{ $image }}" alt="{{ $el.String "title" }}"
                            style="width: 100%; height: 100%; object-fit: cover; object-position: center;"
                            onerror="this.style.display='none'">
                        {{ if gt $score 0.0 }}
                        <div style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.9); color: white; padding: 3px 8px; border-radius: 12px; font-weight: bold; backdrop-filter: blur(4px); font-size: 11px;">
                          ⭐ {{ $score }}
                        </div>
                        {{ end }}
                      </div>
                      
                      <!-- Content -->
                      <div style="padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 70px;">
                        <div class="size-base color-primary" 
                            style="line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; margin-bottom: 8px;">
                          {{ $el.String "title" }}
                        </div>
                        
                        <div class="size-h6" style="display: flex; flex-direction: column; gap: 4px;">
                          <div style="display: flex; align-items: center; gap: 6px;">
                            <span>Type:</span>
                            <span>{{ $type }}</span>
                          </div>
                          <div style="display: flex; align-items: center; gap: 6px;">
                            <span>{{ if $episodes }}{{ $episodes }} Episodes{{ else }}Airing{{ end }}</span>
                          </div>
                        </div>
                      </div>
                    </a>
                  {{ end }}
                {{ end }}
              </div>
            </div>

