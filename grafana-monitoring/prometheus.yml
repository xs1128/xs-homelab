global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['${PROMETHEUS_TARGET}']

  - job_name: 'node'
    static_configs:
      - targets: ['${NODE_TARGET}']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - ${PROBE_TARGET}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ${BLACKBOX_REPLACEMENT}

  - job_name: 'blackbox_exporter'
    static_configs:
      - targets: ['${BLACKBOX_TARGET}']
